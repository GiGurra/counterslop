<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Gallery</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    .panel { position: fixed; left: 16px; top: 16px; max-width: calc(100vw - 32px); background: #000b; padding: 12px 14px; border-radius: 8px; }
    .panel h1 { margin: 0 0 6px; font-size: 16px; color: #8bff4f; }
    .panel p { margin: 0 0 8px; opacity: 0.75; font-size: 12px; }
    .sounds { display: flex; flex-wrap: wrap; gap: 6px; }
    button { font: inherit; padding: 4px 10px; border-radius: 4px; border: 1px solid #fff4; background: #222; color: #eee; cursor: pointer; }
    button:hover { background: #333; }
    .vox { left: auto; right: 16px; width: 420px; max-height: calc(100vh - 32px); overflow: auto; }
    .vox .lines { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 6px 0; }
    .vox .lines button { text-align: left; }
    .vox .lines button.on { border-color: #8bff4f; }
    .vox label { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 6px; font-size: 12px; margin: 2px 0; }
    .vox .say { display: flex; gap: 6px; margin: 6px 0; }
    .vox input[type=text], .vox select { flex: 1; font: 12px ui-monospace, monospace; background: #222; color: #eee; border: 1px solid #fff4; border-radius: 4px; padding: 4px; }
    .vox .caption { min-height: 40px; font: 900 26px/1.2 system-ui, sans-serif; text-transform: uppercase; text-align: center;
      text-shadow: 0 0 12px currentColor, 0 2px 0 #000; margin: 6px 0; }
    .vox canvas { width: 100%; height: 140px; cursor: default; background: #000; border-radius: 4px; }
    .vox .info { font: 11px ui-monospace, monospace; opacity: 0.7; margin-top: 4px; }
    .labels div { position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); font: 12px ui-monospace, monospace;
      background: #000a; padding: 2px 6px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
  </style>
  <script type="importmap">
  { "imports": { "preact": "/vendor/preact/preact.module.js", "preact/hooks": "/vendor/preact/hooks.module.js", "htm": "/vendor/preact/htm.module.js" } }
  </script>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="labels" id="labels"></div>
  <div class="panel">
    <h1>counterslop assets</h1>
    <p>Every material, model and sound, generated at runtime. Drag to orbit.</p>
    <div class="sounds" id="sounds"></div>
  </div>
  <div class="panel vox" id="vox">
    <h1>SlopVox announcer</h1>
    <p>Our own formant voice synth (gen/voice). Click a line to hear it; sliders re-render.
      Phonemes are ARPAbet: stress digits on vowels, ^ shouts, _ and , pause, ~3 stutters the next syllable.</p>
    <label>voice <select id="vox-voice"><option value="">line's own</option></select><span></span></label>
    <label>pitch × <input type="range" id="vox-pitch" min="0.5" max="2" step="0.01" value="1"><span></span></label>
    <label>rate × <input type="range" id="vox-rate" min="0.5" max="2" step="0.01" value="1"><span></span></label>
    <label>formants × <input type="range" id="vox-shift" min="0.7" max="1.4" step="0.01" value="1"><span></span></label>
    <label>robot <input type="range" id="vox-robot" min="-0.01" max="1" step="0.01" value="-0.01"><span></span></label>
    <label>fx mix <input type="range" id="vox-fx" min="-0.01" max="1" step="0.01" value="-0.01"><span></span></label>
    <div class="lines" id="vox-lines"></div>
    <div class="say"><input type="text" id="vox-ph" spellcheck="false"><button id="vox-say">say</button></div>
    <div class="caption" id="vox-caption"></div>
    <canvas id="vox-spec" width="400" height="140"></canvas>
    <div class="info" id="vox-info"></div>
  </div>
  <script type="module" src="/dev/assets.js"></script>
</body>
</html>
