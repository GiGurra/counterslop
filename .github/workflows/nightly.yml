# Nightly: the CI workflow (ci.yml) with scope full. The same jobs then run
# every sim scenario with screenshots (not just the gate's smoke subset) and a
# golden-image diff against the previous nightly's snapshots (advisory, in the
# summary), the long timing-sensitive scenarios at 6x CPU, and every lockstep
# case on both codecs. The snapshots of this run (snapshots-nightly-<i>) become
# the next run's baseline. Not a deploy gate, and never a release: release.yml
# listens for runs of workflow `ci`, and this run is workflow `nightly`.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  ci:
    # A called workflow gets at most the caller's token permissions:
    # actions: read lets the sim jobs download the last nightly's snapshots.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci.yml
    with:
      scope: full
