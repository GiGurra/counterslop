# Release: automatic after every green `ci` run on a push to main (CI on main
# runs one at a time, so releases come out in commit order).
#  1. release  tags the commit CI tested with the next patch version (latest v* + 1),
#              then a GitHub release with prebuilt binaries (linux/darwin, amd64/arm64).
#              CI already passed on that commit, so no tests run again here.
#  2. homebrew publishes Formula/counterslop.rb to GiGurra/homebrew-tap
#              (brew install gigurra/tap/counterslop), over the SSH deploy key in
#              the HOMEBREW_TAP_DEPLOY_KEY secret. Without the secret it skips.
# A minor/major bump: push a higher v* tag by hand on a green commit; the next
# release counts on from it. A commit that already has a v* tag is not released twice.
# A v* tag never deploys anything.
# Re-sync the tap to the latest release without a new release:
#   gh workflow run release.yml -f homebrew_only=true
name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      homebrew_only:
        description: Sync the tap to the latest published release without making a release
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, in order: each one counts on from the tag before it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only after a green ci run for a push to main (not a PR, not a manual tap sync).
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Next version (patch bump) and tag
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if have=$(git tag --points-at "$SHA" --list 'v*' | sort -V | tail -1) && [ -n "$have" ]; then
            echo "$SHA is already released as $have"; echo "version=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # GitHub refuses a GITHUB_TOKEN tag on a commit whose workflow files
          # differ from main's (it counts as changing workflows). Such a commit
          # (only right after a workflow change) is skipped; main's newer commit
          # gets released by its own green run.
          if ! git diff --quiet "$SHA" origin/main -- .github/workflows; then
            echo "$SHA has other workflow files than main; a newer run releases"; echo "version=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(git tag --list 'v*' | sort -V | tail -1); latest=${latest:-v0.0.0}
          if [ "$latest" != v0.0.0 ] && git merge-base --is-ancestor "$SHA" "$latest"; then
            echo "$SHA is behind $latest (an older run finished late)"; echo "version=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          IFS=. read -r major minor patch <<< "${latest#v}"
          version="v$major.$minor.$((patch + 1))"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$version" -m "$version" "$SHA"
          git push origin "$version"
          echo "Releasing $SHA as $version (after $latest)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.version.outputs.version != ''
        with:
          go-version-file: go.mod
      - name: Build binaries
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="counterslop_${VERSION}_${os}_${arch}"
            mkdir -p "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/counterslop" .
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - name: Smoke-test the linux/amd64 binary
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bin="dist/counterslop_${VERSION}_linux_amd64/counterslop"
          "$bin" --addr 127.0.0.1:18080 & pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do
            got=$(curl -fsS 127.0.0.1:18080/version 2>/dev/null) && break || sleep 1
          done
          echo "/version: ${got:-<no answer>}"
          [ "$got" = "$VERSION" ]
      - name: Create the GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt \
              --verify-tag --generate-notes --title "counterslop $VERSION"
          fi

  homebrew:
    name: Publish to the Homebrew tap
    needs: release
    # After a new release, or on its own with homebrew_only (then release is skipped).
    if: ${{ !cancelled() && (inputs.homebrew_only == true || (needs.release.result == 'success' && needs.release.outputs.version != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check for the tap deploy key
        id: key
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          HOMEBREW_ONLY: ${{ inputs.homebrew_only }}
        run: |
          if [ -z "$TAP_KEY" ]; then
            if [ "$HOMEBREW_ONLY" = "true" ]; then
              echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not set."; exit 1
            fi
            echo "HOMEBREW_TAP_DEPLOY_KEY is not set; skipping the tap."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.enabled == 'true'
        with:
          repository: GiGurra/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Bump url and sha256
        id: formula
        if: steps.key.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          url="https://github.com/GiGurra/counterslop/archive/refs/tags/$version.tar.gz"
          # GitHub's source archive can lag the tag by a few seconds.
          curl --fail --location --retry 12 --retry-delay 5 --retry-all-errors --max-time 60 "$url" -o src.tgz
          sha=$(sha256sum src.tgz | cut -d' ' -f1)
          f=tap/Formula/counterslop.rb
          sed -i -e "s|^  url \".*\"|  url \"$url\"|" -e "s|^  sha256 \".*\"|  sha256 \"$sha\"|" "$f"
          ruby -c "$f"
          grep -E '^  (url|sha256) ' "$f"
      - name: Commit and push
        if: steps.key.outputs.enabled == 'true'
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/counterslop.rb
          if git diff --cached --quiet; then echo "Formula already up to date."; exit 0; fi
          git commit -m "counterslop ${{ steps.formula.outputs.version }}"
          git push
