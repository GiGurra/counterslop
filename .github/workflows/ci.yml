# The deploy gate: deploy only commits whose check run
# named "ci" (the job below) passed. Keep the job name "ci".
#
# Also the nightly: nightly.yml calls this workflow with scope full. The same
# jobs then run the long versions (every scenario with screenshots and an
# advisory golden diff, the long throttled set); see each job. A push, a PR or
# a plain dispatch runs scope gate. A called run belongs to the nightly
# workflow, so release.yml (which listens for workflow `ci`) never sees it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: "gate: the deploy gate's checks; full: the nightly's (every scenario, golden diff, long throttled set)"
        type: choice
        options: [gate, full]
        default: gate
  workflow_call:
    inputs:
      scope:
        description: "gate or full (see workflow_dispatch)"
        type: string
        default: gate

# One run per ref at a time. On main a run in progress always finishes (so
# a test env following main keeps deploying under rapid pushes) and only the newest push waits
# behind it: GitHub replaces a pending run with a newer one, so queued runs in
# between are cancelled. Elsewhere (PRs) a new push cancels the running one.
# A full run (the nightly, also on main) has a group of its own, so it never
# replaces a pending push run on main (that commit would then not deploy).
concurrency:
  group: ci-${{ inputs.scope == 'full' && 'full-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # simdiff compares with the previous commit
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # Known vulnerabilities our code reaches (stdlib + modules), pinned so the
      # tool itself can't change under us; the vuln database is always current.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      # go test ./... runs once, with coverage: every Go test, the JS unit tests
      # (web/**/*.test.mjs via node --test), the Go<->JS parity tests, and
      # TestGeneratedUpToDate (web/**/*.gen.js must match its Go: cmd/gojs).
      # A failing test fails the step; so does a package under its floor in
      # coverage-floors.txt (the ratchet; table in the job summary).
      # The long bot/realtime tests run in test-ai (scripts/coverage.sh: COVERAGE_PART);
      # internal/game's floor is checked across both runs by the coverage job.
      # internal/content/... (the map walks: every map, every team, both movement
      # models; ~8 CPU-min) runs in test-content beside this job.
      - name: go test + coverage
        run: COVERAGE_PART=main MAIN_SHARD=core ./scripts/coverage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cover-main
          path: cover-main.out
          retention-days: 3
      # Hits / time to kill per weapon, armor, part and distance (bands: TestBalanceBands).
      - name: balance table
        run: go run ./cmd/balance -md "$GITHUB_STEP_SUMMARY" > /dev/null
      - name: build
        run: go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o counterslop .
      # What this commit does to gameplay: every sim/cases trace vs the previous
      # commit, in the job summary. Informational (a change may be intended).
      - name: behaviour diff
        if: github.event_name == 'push'
        run: go run ./cmd/simdiff -md "$GITHUB_STEP_SUMMARY" HEAD~1 HEAD || true

  # internal/content/...: the maps and their checks (every map walked to its
  # sites by every team in both movement models, generated nav graphs, goldens),
  # with those packages' coverage floors. Beside test: together they took 4:50.
  test-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test + coverage (internal/content/...)
        run: COVERAGE_PART=main MAIN_SHARD=content ./scripts/coverage.sh

  # internal/game's long tests (^(TestAI|TestRideRealtime|TestBotRuns): whole bot
  # matches, rocket rides): with the rest of the package in one go test run they
  # passed CI's 10 minute per-package test timeout. In parallel with test, in
  # three shards: TestAIMoonshot alone, the rest (one job of them all took 9 min),
  # and slow: the package's slowest other tests (every sim/case through the
  # server and delta vs json, spawn and site searches: ~2 min that kept test
  # past 5 min; scripts/coverage.sh $slow).
  test-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [moonshot, rest, slow]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (bots, realtime rides) + coverage profile
        run: COVERAGE_PART=ai AI_SHARD=${{ matrix.shard }} ./scripts/coverage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cover-ai-${{ matrix.shard }}
          path: cover-ai-${{ matrix.shard }}.out
          retention-days: 3

  # internal/game's coverage floor, over test's and test-ai's profiles together.
  coverage:
    needs: [test, test-ai]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cover-*
          merge-multiple: true
      - name: internal/game coverage (both runs)
        run: COVERAGE_PART=merge ./scripts/coverage.sh

  # sim/cases end to end: the real server and headless clients in lockstep,
  # tick by tick, with real input events. Fails if any case fails, or if any
  # action-registry entry (binds, buttons, console and admin commands) has no
  # passing case; the coverage matrix goes to the job summary.
  # Once per snapshot codec (--net-codec): every case must pass on each, and
  # on delta no client may see a snapshot checksum mismatch.
  # The cases run in full in both scopes; full only allows more time.
  # Each codec's cases in 3 shards (balanced by sim/case-timings.json; one job
  # of them all took ~6.5 min): each shard runs its cases and writes its part
  # (-case-results); cases-registry checks the action registry over every part.
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scope == 'full' && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        codec: [json, delta]
        shard: ["1/3", "2/3", "3/3"]
    name: cases (${{ matrix.codec }}, ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build the harness
        run: go build -o simbin ./cmd/sim
      - name: lockstep cases (shard ${{ matrix.shard }})
        env:
          CHROME: /usr/bin/google-chrome
        run: ./simbin -cases -shard ${{ matrix.shard }} -j 4 -net-codec ${{ matrix.codec }} -case-results cases-${{ matrix.codec }}-${{ strategy.job-index }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cases-${{ matrix.codec }}-${{ strategy.job-index }}
          path: cases-${{ matrix.codec }}-${{ strategy.job-index }}.json
          if-no-files-found: ignore
          retention-days: 3
      # The merge needs no Go toolchain: one shard hands over its harness binary.
      - uses: actions/upload-artifact@v4
        if: strategy.job-index == 0
        with:
          name: simbin
          path: simbin
          retention-days: 1

  # The action registry over every cases shard, once per codec: every e2e case
  # in exactly one part, and every bindable action, command button, console
  # command, client cvar and admin command exercised by a passing case (or
  # exempt in sim/registry-exempt.json); the coverage matrix goes to the summary.
  cases-registry:
    needs: [cases]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cases-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: simbin
      - name: action registry (json)
        run: chmod +x simbin && ./simbin -cases-merge cases-json-*.json
      - name: action registry (delta)
        if: always()
        run: ./simbin -cases-merge cases-delta-*.json

  # Headless Chrome (preinstalled on the runner) drives the real client through
  # the sim scenarios; a failed expectation, step error or uncaught page
  # exception fails the job.
  # gate: the smoke subset (Makefile SMOKE) in 4 shards. No PNGs (-no-shots: no
  # assertion reads pixels, so nothing is drawn on the GPU; the full scope takes
  # the pictures), but every snapshot's JSON state and a failed step's
  # fail-<client>.png are uploaded.
  # full: every scenario with screenshots, and a golden-image diff against the
  # previous nightly's snapshots (advisory: rendering changes on purpose too, so
  # diffs are listed in the summary, not failed). Each shard uploads its
  # snapshots as snapshots-nightly-<i>; they become the next nightly's baseline.
  # 3 shards of 35 min at most: one job ran ~30 min of scenarios plus the rest
  # and passed a 45 min timeout (11-22, 11-23); the perf-* benches alone are
  # ~10 min of software GL.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scope == 'full' && 35 || 10 }}
    permissions:
      contents: read
      actions: read # the full scope downloads the last nightly's snapshots
    strategy:
      fail-fast: false
      matrix:
        # balanced by sim/timings.json (cmd/sim/shard.go)
        shard: ${{ fromJSON(inputs.scope == 'full' && '["1/3","2/3","3/3"]' || '["1/4","2/4","3/4","4/4"]') }}
        # Once per snapshot codec (--net-codec), as the cases job: every scenario
        # must pass on each, and cmd/sim fails one whose pages saw a snapshot
        # checksum mismatch (codecFails). full: delta runs every scenario too,
        # without pictures or the golden diff (the json shards take those).
        codec: [json, delta]
    name: sim (${{ matrix.shard }}, ${{ matrix.codec }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: sim smoke
        if: inputs.scope != 'full'
        env:
          CHROME: /usr/bin/google-chrome
        run: make sim-smoke SHARD=${{ matrix.shard }} NET_CODEC=${{ matrix.codec }} # the scenario list lives in the Makefile
      - name: every scenario (shard ${{ matrix.shard }}), delta codec
        if: inputs.scope == 'full' && matrix.codec == 'delta'
        env:
          CHROME: /usr/bin/google-chrome
        run: go run ./cmd/sim -shard ${{ matrix.shard }} -no-shots -net-codec delta
      - name: baseline (previous nightly's snapshots)
        if: inputs.scope == 'full' && matrix.codec == 'json'
        env:
          GH_TOKEN: ${{ github.token }}
        # Every snapshots-nightly* artifact of the last green nightly run (one per
        # shard; older runs: one snapshots-nightly), merged as
        # baseline/<scenario>/<shot>.png whatever directory layout the download gives.
        run: |
          mkdir -p baseline dl
          id=$(gh run list --workflow nightly --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -n "$id" ]; then gh run download "$id" -p 'snapshots-nightly*' -D dl || true; fi
          find dl -name '*.png' | while read -r f; do
            s=$(basename "$(dirname "$f")"); mkdir -p "baseline/$s"; cp "$f" "baseline/$s/"
          done
          echo "baseline: $(find baseline -name '*.png' | wc -l) images from run ${id:-none}"
      - name: every scenario (shard ${{ matrix.shard }}) + golden diff
        if: inputs.scope == 'full' && matrix.codec == 'json'
        env:
          CHROME: /usr/bin/google-chrome
        run: go run ./cmd/sim -shard ${{ matrix.shard }} -diff -diff-advisory -golden baseline
      - name: snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ inputs.scope == 'full' && 'nightly-' || '' }}${{ matrix.codec == 'delta' && 'delta-' || '' }}${{ strategy.job-index }}
          path: out/snapshots
          if-no-files-found: ignore
          retention-days: 14

  # The same engine on a slow machine: timing-sensitive scenarios with every
  # page's CPU 6x slower. Lockstep runs on game time only (TESTING.md), so a
  # result must not change.
  # gate: the short ones (Makefile SMOKE_THROTTLED). full: the long ones
  # (SMOKE_THROTTLED_NIGHTLY: whole matches, rounds, map loads, 45-160 s each
  # throttled), too slow for the gate.
  sim-throttled:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scope == 'full' && 30 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: sim throttled
        if: inputs.scope != 'full'
        env:
          CHROME: /usr/bin/google-chrome
        run: make sim-throttled
      - name: long scenarios, CPU throttled 6x
        if: inputs.scope == 'full'
        env:
          CHROME: /usr/bin/google-chrome
        run: make sim-throttled-nightly # writes to out/throttled
      - name: snapshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.scope == 'full' && 'throttled-nightly' || 'snapshots-throttled' }}
          path: ${{ inputs.scope == 'full' && 'out/throttled' || 'out/snapshots' }}
          if-no-files-found: ignore
          retention-days: 14

  # The one check the deploy gate reads: green only if every job passed.
  ci:
    name: ci
    needs: [test, test-content, test-ai, coverage, sim, sim-throttled, cases, cases-registry]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test=${{ needs.test.result }} test-content=${{ needs.test-content.result }} test-ai=${{ needs.test-ai.result }} coverage=${{ needs.coverage.result }} sim=${{ needs.sim.result }} sim-throttled=${{ needs.sim-throttled.result }} cases=${{ needs.cases.result }} cases-registry=${{ needs.cases-registry.result }}"
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.test-content.result }}" = success ] && [ "${{ needs.test-ai.result }}" = success ] && [ "${{ needs.coverage.result }}" = success ] && [ "${{ needs.sim.result }}" = success ] && [ "${{ needs.sim-throttled.result }}" = success ] && [ "${{ needs.cases.result }}" = success ] && [ "${{ needs.cases-registry.result }}" = success ]
