# The deploy gate: counterslop-test / prod only deploy commits whose check run
# named "ci" (the job below) passed. Keep the job name "ci".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref at a time. On main a run in progress always finishes (so
# test keeps deploying under rapid pushes) and only the newest push waits
# behind it: GitHub replaces a pending run with a newer one, so queued runs in
# between are cancelled. Elsewhere (PRs) a new push cancels the running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # simdiff compares with the previous commit
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # Includes the JS unit tests (web/**/*.test.mjs via node --test) and the
      # Go<->JS parity tests for movement physics and model poses.
      - name: go test
        run: go test ./...
      # Hits / time to kill per weapon, armor, part and distance (bands: TestBalanceBands).
      - name: balance table
        run: go run ./cmd/balance -md "$GITHUB_STEP_SUMMARY" > /dev/null
      # The ratchet: per-package floors in coverage-floors.txt, table in the job summary.
      - name: coverage
        run: ./scripts/coverage.sh
      - name: build
        run: go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o counterslop .
      # What this commit does to gameplay: every sim/cases trace vs the previous
      # commit, in the job summary. Informational (a change may be intended).
      - name: behaviour diff
        if: github.event_name == 'push'
        run: go run ./cmd/simdiff -md "$GITHUB_STEP_SUMMARY" HEAD~1 HEAD || true

  # sim/cases end to end: the real server and headless clients in lockstep,
  # tick by tick, with real input events. Fails if any case fails, or if any
  # action-registry entry (binds, buttons, console and admin commands) has no
  # passing case; the coverage matrix goes to the job summary.
  cases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lockstep cases + action registry
        env:
          CHROME: /usr/bin/google-chrome
        run: go run ./cmd/sim -cases -j 4

  # Headless Chrome (preinstalled on the runner) drives the real client through
  # a smoke subset of the sim scenarios; a failed expectation, step error or
  # uncaught page exception fails the job. Snapshots are uploaded either way.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: sim smoke
        env:
          CHROME: /usr/bin/google-chrome
        run: make sim-smoke SHARD=${{ matrix.shard }} # the scenario list lives in the Makefile
      - name: snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ strategy.job-index }}
          path: out/snapshots
          if-no-files-found: ignore
          retention-days: 14

  # The one check the deploy gate reads: green only if every job passed.
  ci:
    name: ci
    needs: [test, sim, cases]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test=${{ needs.test.result }} sim=${{ needs.sim.result }} cases=${{ needs.cases.result }}"
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.sim.result }}" = success ] && [ "${{ needs.cases.result }}" = success ]
