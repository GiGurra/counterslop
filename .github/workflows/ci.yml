# The deploy gate: counterslop-test / prod only deploy commits whose check run
# named "ci" (the job below) passed. Keep the job name "ci".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      # Includes the JS unit tests (web/**/*.test.mjs via node --test) and the
      # Go<->JS parity tests for movement physics and model poses.
      - name: go test
        run: go test ./...
      - name: build
        run: go build -ldflags "-X main.version=${GITHUB_SHA::7}" -o counterslop .

  # Headless Chrome (preinstalled on the runner) drives the real client through
  # a smoke subset of the sim scenarios; a failed expectation, step error or
  # uncaught page exception fails the job. Snapshots are uploaded either way.
  sim:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: sim smoke
        env:
          CHROME: /usr/bin/google-chrome
        run: >-
          go run ./cmd/sim
          prediction hitboxes weapons scope pickup-swap teams shoot-the-bot
          admin jump-hold jump-crouched sim-rate console-open spawn-overview aim audio-resume weapon-keys weapon-keys-migrated reload-indicator resync-faults
      - name: snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: out/snapshots
          if-no-files-found: ignore
          retention-days: 14

  # The one check the deploy gate reads: green only if both jobs passed.
  ci:
    name: ci
    needs: [test, sim]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test=${{ needs.test.result }} sim=${{ needs.sim.result }}"
          [ "${{ needs.test.result }}" = success ] && [ "${{ needs.sim.result }}" = success ]
